name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: npm ci
      - name: Verify release
        run: npm run check
      - name: Build release package
        id: package
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --verify-tag --generate-notes --title "Lambdo $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
