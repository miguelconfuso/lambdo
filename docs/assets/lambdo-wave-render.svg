<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140" role="img" aria-labelledby="title description">
  <title id="title">Lambdo terminal wave render</title>
  <desc id="description">A wave built with the same upright grid cells and glyph selection used by the Lambdo renderer. It draws once, pauses, then erases itself.</desc>

  <defs>
    <clipPath id="reveal-wave">
      <rect x="8" y="4" width="0" height="132">
        <animate attributeName="width" values="0;704;704;0;0" keyTimes="0;0.42;0.62;0.95;1" dur="4s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#reveal-wave)" fill="#f05c58" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">
