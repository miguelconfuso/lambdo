<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140" role="img" aria-labelledby="title description">
  <title id="title">Lambdo character wave cycle</title>
  <desc id="description">A continuous character wave draws itself from left to right, pauses, then erases itself.</desc>

  <defs>
    <path id="wave-line" d="M20 70 C48 20 92 20 120 70 S192 120 220 70 S292 20 320 70 S392 120 420 70 S492 20 520 70 S592 120 620 70 S680 25 700 55" fill="none" />
    <linearGradient id="wave-colour" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f05c58" />
      <stop offset="0.5" stop-color="#ff7a72" />
      <stop offset="1" stop-color="#f05c58" />
    </linearGradient>
    <clipPath id="reveal-wave">
      <rect x="8" y="8" width="0" height="124">
        <animate attributeName="width" values="0;704;704;0;0" keyTimes="0;0.42;0.62;0.95;1" dur="4s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#reveal-wave)" font-family="Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" letter-spacing="-1">
    <text fill="url(#wave-colour)" dy="6">
      <textPath href="#wave-line">█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0█▓▒▪●+=∞π√≠×A0</textPath>
    </text>
  </g>
</svg>

