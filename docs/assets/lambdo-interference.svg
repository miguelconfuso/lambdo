    <text x="135" y="204" fill="#f05c58" text-anchor="middle" font-size="24" font-weight="700">≠+π</text>
    <text x="135" y="232" fill="#f05c58" text-anchor="middle" font-size="24" font-weight="700">√++÷</text>
    <text x="135" y="260" fill="#f05c58" text-anchor="middle" font-size="24" font-weight="700">√++π×</text>
    <line x1="0" y1="286" x2="270" y2="286" stroke="#303640" stroke-width="2"/>

    <text x="24" y="322" fill="#747d8c" font-size="17">MODE</text>
    <text x="92" y="322" fill="#f5f7fa" font-size="17">1 WAVE</text>
    <text x="180" y="322" fill="#5dd7e5" font-size="17" font-weight="700">2 MIX</text>
    <text x="24" y="358" fill="#747d8c" font-size="17">PARAMETERS  ↑↓</text>
    <text x="24" y="394" fill="#f05c58" font-size="18" font-weight="700">&gt; A</text><text x="238" y="394" fill="#f05c58" text-anchor="end" font-size="18">1.00</text>
    <text x="24" y="426" fill="#f5f7fa" font-size="18">  λ</text><text x="238" y="426" fill="#f5f7fa" text-anchor="end" font-size="18">8.00 m</text>
    <text x="24" y="458" fill="#f5f7fa" font-size="18">  f</text><text x="238" y="458" fill="#f5f7fa" text-anchor="end" font-size="18">1.00 Hz</text>
    <text x="24" y="490" fill="#f5f7fa" font-size="18">  φA</text><text x="238" y="490" fill="#f5f7fa" text-anchor="end" font-size="18">0.00 rad</text>
    <text x="24" y="522" fill="#f5f7fa" font-size="18">  φB</text><text x="238" y="522" fill="#f5f7fa" text-anchor="end" font-size="18">1.57 rad</text>
    <text x="24" y="554" fill="#f5f7fa" font-size="18">  time</text><text x="238" y="554" fill="#f5f7fa" text-anchor="end" font-size="18">1.00×</text>
    <text x="24" y="620" fill="#63c985" font-size="18" font-weight="700">▶ LIVE  t 2.41s</text>
