    <text x="302" y="638" fill="#e5bf55" font-size="18" font-weight="700">INTERFERENCE: PARTIAL · QUARTER CYCLE</text>
    <text x="302" y="664" fill="#f5f7fa" font-size="16">φA ●────────  φB ──●──────  Δφ 1.57 rad</text>
