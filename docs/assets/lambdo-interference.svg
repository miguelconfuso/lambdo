    <text x="107" y="658" fill="#090b0f" text-anchor="middle" font-size="16" font-weight="700">←  →  CHANGE</text>

    <text x="302" y="88" fill="#5dd7e5" font-size="23" font-weight="700">INTERFERENCE</text>
    <text x="1168" y="88" fill="#63c985" text-anchor="end" font-size="18" font-weight="700">LIVE  t=2.41s</text>
    <text x="302" y="124" fill="#f05c58" font-size="17">y₁(x,t) = 1.00 sin(0.79x − 6.28t + 0.00)</text>
    <text x="302" y="272" fill="#5dd7e5" font-size="17">y₂(x,t) = 1.00 sin(0.79x − 6.28t + 1.57)</text>

