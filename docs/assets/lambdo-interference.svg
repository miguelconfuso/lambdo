<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Lambdo interference laboratory</title>
  <desc id="description">Terminal preview with wave controls, two waves and their partially constructive result.</desc>
  <rect width="1200" height="680" rx="24" fill="#090b0f"/>
  <rect x="1" y="1" width="1198" height="678" rx="23" fill="none" stroke="#303640" stroke-width="2"/>
  <circle cx="30" cy="28" r="7" fill="#f05c58"/>
  <circle cx="54" cy="28" r="7" fill="#e5bf55"/>
  <circle cx="78" cy="28" r="7" fill="#63c985"/>
